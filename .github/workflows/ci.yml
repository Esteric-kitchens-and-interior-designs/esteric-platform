name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    env:
      # Codegen-only placeholder — Prisma client generation needs a
      # well-formed connection string, not a reachable database.
      DATABASE_URL: "postgresql://user:password@localhost:5432/esteric?schema=public"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/database run build

      - name: Lint
        run: pnpm run check

      - name: Typecheck
        run: pnpm -r --if-present run typecheck
